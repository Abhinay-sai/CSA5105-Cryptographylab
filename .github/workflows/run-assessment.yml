name: Run Assessment Tool 3 Tasks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-assessment-tasks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Execute All Cryptography Assessment Tasks
      run: |
        python Assessment_Tool_3/run_all_assessment_tasks.py
